- name: Deploy web container (idempotent)
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Ensure devops-web container is running
      community.docker.docker_container:
        name: "devops-web-{{ ansible_date_time.epoch }}"
        image: devops-web:latest
        state: started
        published_ports:
          - "8091:80"
