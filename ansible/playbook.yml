---
- name: Deploy web container using Docker
  hosts: web
  gather_facts: false
  # XÓA DÒNG BECOME: YES ĐI

  tasks:
    - name: Remove old container if exists
      shell: "docker rm -f devops-web"
      ignore_errors: yes

    - name: Run new container
      shell: "docker run -d -p 8091:80 --name devops-web devops-web:latest"