- name: Deploy web container using Docker
  hosts: web
  gather_facts: false 
  become: yes  # Phải có dòng này để dùng quyền của cấu hình sudoers bạn đã làm

  tasks:
    - name: Remove old container if exists
      shell: "docker rm -f devops-web"
      ignore_errors: yes

    - name: Run new container
      shell: >
        docker run -d
        -p 8091:80
        --name devops-web
        --privileged           # Thêm flag này nếu bạn vẫn bị lỗi AppArmor
        devops-web:latest