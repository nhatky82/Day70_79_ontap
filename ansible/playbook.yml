---
- name: Deploy web container using Docker
  hosts: web
  gather_facts: false

  tasks:
    - name: Deploy Container
      community.docker.docker_container:
        name: devops-web
        image: devops-web:latest
        state: started
        recreate: yes
        # Thêm các tùy chọn bảo mật để tránh lỗi AppArmor
        privileged: yes
        published_ports:
          - "8091:80"
        restart_policy: always