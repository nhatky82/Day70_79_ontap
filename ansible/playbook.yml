- name: Deploy web container (idempotent)
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Ensure devops-web container is running
      community.docker.docker_container:
        name: devops-web
        image: devops-web:latest
        state: started
        restart_policy: always
        recreate: true
        published_ports:
          - "8091:80"
